<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ABM Elections 2026-2027</title>
  <link rel="icon" href="images/logo.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top"><div class="wrap">
    <img src="images/logo.png" alt="ABM logo">
    <h1>ABM Elections <span>2026-2027</span></h1>
  </div></header>

  <main>
    <div class="card center winner" id="box"><p>Counting votes…</p></div>
    <div class="actions"><a class="btn secondary" href="home.html">Go back</a></div>
  </main>

  <script type="module">
    import { PEOPLE, CANDIDATES, requireUser, resultsOpen, countVotes,
             RESULTS_TIME_LABEL } from "./js/app.js";

    requireUser();
    const box = document.getElementById("box");

    if (!resultsOpen()) {
      box.innerHTML = `<h2>Results are not ready yet</h2>
        <p>The winner will be shown after ${RESULTS_TIME_LABEL}.</p>`;
    } else {
      try {
        const counts = await countVotes();
        const top = Math.max(...Object.values(counts));
        const winners = CANDIDATES.filter(c => counts[c] === top);
        const tally = `<ul class="tally">${CANDIDATES
          .slice().sort((a, b) => counts[b] - counts[a])
          .map(c => `<li><span>${PEOPLE[c].name}</span><b>${counts[c]} vote${counts[c] === 1 ? "" : "s"}</b></li>`)
          .join("")}</ul>`;

        if (top === 0) {
          box.innerHTML = `<h2>No votes were cast.</h2>`;
        } else if (winners.length === 1) {
          const w = PEOPLE[winners[0]];
          box.innerHTML = `<p>The winner of ABM Elections 2026-2027 is</p>
            <img src="${w.photo}" alt="${w.name}">
            <h2>${w.name}</h2>
            <p class="congrats">🎉 Congratulations! 🎉</p>${tally}`;
        } else {
          box.innerHTML = `<h2>It's a tie!</h2>
            <p>${winners.map(c => PEOPLE[c].name).join(" and ")} have the same number of votes.</p>
            <p class="congrats">🎉 Congratulations! 🎉</p>${tally}`;
        }
      } catch (err) {
        box.innerHTML = `<p class="msg"></p>`;
        box.querySelector(".msg").textContent = err.message || String(err);
      }
    }
  </script>
</body>
</html>
