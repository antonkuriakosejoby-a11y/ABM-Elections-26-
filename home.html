<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ABM Elections 2026-2027</title>
  <link rel="icon" href="images/logo.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top"><div class="wrap">
    <img src="images/logo.png" alt="ABM logo">
    <h1>ABM Elections <span>2026-2027</span></h1>
  </div></header>

  <main>
    <h2 class="welcome">Welcome <b id="welcomeName"></b> to ABM elections 2026 voting page</h2>
    <p class="endtime">End time: <b id="endTime"></b></p>
    <p class="countdown" id="countdown"></p>

    <div class="card profile">
      <div class="details">
        <p><b>Name:</b> <span id="name"></span></p>
        <p><b>Candidate or voting person:</b> <span id="role"></span></p>
        <p><b>User ID:</b> <span id="userId"></span></p>
        <p><b>Status:</b> <span id="status" class="pill">Checking…</span></p>
      </div>
      <img id="photo" alt="">
    </div>

    <p class="msg" id="err" hidden></p>

    <div class="actions">
      <a class="btn secondary" href="candidates.html">See candidates</a>
      <button class="btn" id="voteBtn" disabled>Vote</button>
    </div>
    <p class="msg" id="voteMsg" hidden></p>

    <div class="card center winner" id="winner" style="margin-top:28px" hidden></div>

    <a href="#" class="logout" id="logout">Log out</a>
  </main>

  <script type="module">
    import { PEOPLE, CANDIDATES, RESULTS_TIME_LABEL, requireUser, getMyVote, votingClosed, resultsOpen,
             countVotes, startCountdown, showError, logout } from "./js/app.js";

    const key = requireUser();
    const me = PEOPLE[key];
    const $ = (id) => document.getElementById(id);

    $("welcomeName").textContent = me.name;
    $("endTime").textContent = RESULTS_TIME_LABEL;
    $("name").textContent = me.name;
    $("role").textContent = me.candidate ? "Candidate" : "Voting person";
    $("userId").textContent = me.userId;
    $("photo").src = me.photo;
    $("photo").alt = me.name;
    startCountdown($("countdown"));
    $("logout").onclick = (e) => { e.preventDefault(); logout(); };

    // After the end time, show the winner of ABM company right on this page.
    if (resultsOpen()) {
      const box = $("winner");
      box.hidden = false;
      box.innerHTML = "<p>Counting votes…</p>";
      countVotes().then(counts => {
        const top = Math.max(...Object.values(counts));
        const winners = CANDIDATES.filter(c => counts[c] === top);
        const votesText = `<p style="font-size:20px;font-weight:700;margin:4px 0 10px">${top} vote${top === 1 ? "" : "s"}${winners.length > 1 ? " each" : ""}</p>`;
        if (top === 0) {
          box.hidden = true;   // nothing to show until someone votes
        } else if (winners.length === 1) {
          const w = PEOPLE[winners[0]];
          box.innerHTML = `<p>Winner of ABM company</p>
            <img src="${w.photo}" alt="${w.name}">
            <h2>${w.name}</h2>${votesText}
            <p class="congrats">🎉 Congratulations! 🎉</p>`;
        } else {
          box.innerHTML = `<p>Winners of ABM company (tie)</p>
            <h2>${winners.map(c => PEOPLE[c].name).join(" and ")}</h2>${votesText}
            <p class="congrats">🎉 Congratulations! 🎉</p>`;
        }
      }).catch(err => { box.innerHTML = ""; showError(box, err); });
    }

    try {
      const vote = await getMyVote(key);
      const status = $("status");
      status.textContent = vote ? "Completed" : "Not completed";
      status.classList.add(vote ? "done" : "notdone");

      const btn = $("voteBtn");
      if (vote) {
        btn.textContent = "Already voted";
      } else {
        btn.disabled = false;
        btn.onclick = () => {
          if (votingClosed()) {
            $("voteMsg").textContent = "Sorry, vote time is over.";
            $("voteMsg").hidden = false;
          } else {
            location.href = "vote.html";
          }
        };
      }
    } catch (err) {
      $("status").textContent = "Unknown";
      showError($("err"), err);
    }
  </script>
</body>
</html>
